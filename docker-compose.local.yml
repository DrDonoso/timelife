name: timelife-local
services:
  app:
    build:
      context: .
    image: timelife:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-7779}:7779"
    environment:
      DATABASE_URL: "postgresql+asyncpg://timelife:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/timelife"
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET}"
      PUBLIC_ORIGIN: "${LOCAL_PUBLIC_ORIGIN:-http://localhost:7779}"
      AUTH_COOKIE_SECURE: "false"
      ALLOW_INSECURE_LOCAL_LOGIN: "true"
      LOCAL_LOGIN_PASSWORD: "${LOCAL_LOGIN_PASSWORD:-admin}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SESSION_DAYS: "${SESSION_DAYS:-30}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-30}"
      MAX_VIDEO_UPLOAD_MB: "${MAX_VIDEO_UPLOAD_MB:-500}"
      MAX_VIDEO_MINUTES: "${MAX_VIDEO_MINUTES:-10}"
      MEDIA_DIR: /app/data/media
      TZ: "${TZ:-Europe/Madrid}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-127.0.0.1}"
    volumes:
      - media:/app/data/media
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: timelife
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: timelife
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timelife -d timelife"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
  media:
