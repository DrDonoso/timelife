[project]
name = "timelife"
version = "0.1.0"
description = "Private, multilingual family timeline of each child's milestones"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150",
    "uvicorn[standard]>=0.50",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "pydantic-settings>=2.14",
    "email-validator>=2.3",
    "python-multipart>=0.0.20",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.13,<3",
    "pillow>=12",
    "pillow-heif>=1.8",
    "tzdata>=2026.1",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "aiosqlite>=0.22",
    "ruff>=0.17",
    "mypy>=2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient prefers the optional httpx2 package; httpx works the same for tests.
    "ignore:Using `httpx` with `starlette:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src/timelife"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
