name: CI
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
# Every job runs on GitHub-hosted runners: never add self-hosted ones to a public repository, where
# pull requests from forks could run their own code on them.
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: timelife_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d timelife_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv also installs Python: every Python command goes through it.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.14"
      - name: uv.lock resolves from PyPI only
        run: |
          if grep -oE 'https?://[^/"]+' uv.lock | sort -u | grep -vxE 'https://(pypi\.org|files\.pythonhosted\.org)'; then
            echo "::error file=uv.lock::Lock the dependencies against PyPI (https://pypi.org/simple), not a mirror"
            exit 1
          fi
      - name: Install FFmpeg (video uploads)
        run: bash .github/scripts/install-ffmpeg.sh
      - run: uv sync --locked
      - name: Run backend tests on PostgreSQL
        run: >-
          uv run --no-sync pytest -q --durations=25
          --junitxml="$RUNNER_TEMP/pytest.xml"
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@localhost:5432/timelife_test
      - run: uv run --no-sync ruff check src tests scripts alembic
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python scripts/export_openapi.py --check
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results
          path: ${{ runner.temp }}/pytest.xml
          if-no-files-found: ignore
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm writes the registry it installed from into the lockfile: keep it the public one.
      - name: package-lock.json resolves from registry.npmjs.org only
        working-directory: frontend
        run: |
          if grep -E '"resolved": "' package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/'; then
            echo "::error file=frontend/package-lock.json::Every \"resolved\" URL must start with https://registry.npmjs.org/"
            exit 1
          fi
      - run: uv sync --locked
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run gen:api -- --check && npm run lint && npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # The e2e server converts the uploaded video fixtures.
      - name: Install FFmpeg (video uploads)
        run: bash .github/scripts/install-ffmpeg.sh
      - run: npm run e2e
        working-directory: frontend
      # The static public demo (src/demo/): built with `build:demo` and smoke-tested in Chromium.
      - run: npm run e2e:demo
        working-directory: frontend
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: docker-compose.yml
      COMPOSE_PROJECT_NAME: timelife-ci
      POSTGRES_PASSWORD: ci-postgres-only
      AUTH_SECRET: ci-secret-only-not-a-production-secret-12345
      PUBLIC_ORIGIN: http://localhost:7779
      AUTH_COOKIE_SECURE: "false"
      # Fake but well-formed: Google sign-in is configured, never contacted.
      GOOGLE_CLIENT_ID: 123456789012-abcdefghijklmnopqrstuvwxyz012345.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-google-secret-not-a-real-secret
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the actual production image
        run: docker build --build-arg IMAGE_TAG=ci -t drdonoso/timelife:ci .
      - name: Boot the isolated production stack
        run: |
          docker compose pull db
          docker compose up -d --pull never --wait --wait-timeout 180
      - name: Smoke-test the running container
        shell: bash
        run: |
          base=http://localhost:7779
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          send() { status -H "Origin: $base" -H 'X-Timelife-Request: 1' "$@"; }
          test "$(status "$base/health")" = 200
          curl -fsS "$base/api/version" | jq -e '.version == "ci"'
          test "$(status "$base/api/children")" = 401
          curl -fsS "$base/api/auth/config" | jq -e '.google_enabled == true and .dev_login_enabled == false
            and .password_reset_enabled == false and .setup_required == true'
          test "$(send --json '{"username":"admin","password":"admin"}' "$base/api/auth/dev-login")" = 404
          # A new installation: the first administrator, then e-mail and password sign-in.
          admin='{"email":"ci-admin@example.com","password":"ci-admin-password"}'
          test "$(send --json "$admin" "$base/api/auth/setup")" = 200
          curl -fsS "$base/api/auth/config" | jq -e '.setup_required == false'
          test "$(send --json '{"email":"other@example.com","password":"ci-other-password"}' "$base/api/auth/setup")" = 403
          test "$(send --json "$admin" "$base/api/auth/login")" = 200
          test "$(send --json '{"email":"ci-admin@example.com","password":"wrong-password"}' "$base/api/auth/login")" = 401
          test "$(send --json '{"email":"ci-admin@example.com"}' "$base/api/auth/password/forgot")" = 404
          # Administrator recovery: a single-use link for the public origin.
          docker compose exec -T app python -m timelife.setup | grep -E '^  http://localhost:7779/setup#[0-9a-f]{64}$'
          curl -fsS "$base/" | grep -F '<div id="root">'
          test "$(docker compose exec -T app id -u)" = 1000
          # Video uploads: ffprobe, and ffmpeg with H.264, AAC and the HDR tone mapping filters.
          docker compose exec -T app ffprobe -hide_banner -version >/dev/null
          docker compose exec -T app sh -c \
            'ffmpeg -hide_banner -encoders | grep -q libx264 && ffmpeg -hide_banner -encoders | grep -q " aac " && ffmpeg -hide_banner -filters | grep -q zscale && ffmpeg -hide_banner -filters | grep -q tonemap'
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans
  application:
    needs: [backend, frontend, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$DOCKER_RESULT" = success
