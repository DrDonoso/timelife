name: Build and publish Docker image
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - .github/CODEOWNERS
      - .github/dependabot.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timelife-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    # Forks build and test like upstream, but only this repository publishes the image.
    if: github.ref == 'refs/heads/main' && github.repository == 'DrDonoso/timelife'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      IMAGE: drdonoso/timelife
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # A version is free when neither a git tag nor an image tag has it: published images are
      # never overwritten.
      - name: Compute serialized CalVer
        id: version
        shell: bash
        run: |
          set -euo pipefail
          image_exists() { # image_exists <tag>
            local output
            if output=$(docker buildx imagetools inspect "$IMAGE:$1" 2>&1); then return 0; fi
            if grep -q 'not found' <<<"$output"; then return 1; fi
            echo "::error::Could not check whether $IMAGE:$1 exists: $output"
            exit 1
          }
          day=$(date -u +%Y%m%d)
          version="$day"
          number=2
          while git rev-parse --verify --quiet "refs/tags/$version" >/dev/null || image_exists "$version"; do
            version=$(printf '%s.%02d' "$day" "$number")
            number=$((number + 1))
          done
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
          build-args: |
            IMAGE_TAG=${{ steps.version.outputs.value }}
            BUILD_DATE=${{ steps.version.outputs.date }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
